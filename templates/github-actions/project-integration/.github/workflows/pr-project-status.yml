# =============================================================================
# PR Project Status Workflow (Caller)
# =============================================================================
# Calls the reusable workflow from TE-ToshiakiTanaka2/tarnished to automatically
# update linked Issue status in GitHub Projects when PR is opened.
#
# Prerequisites:
#   1. Create a GitHub Personal Access Token (classic) with these scopes:
#      - repo (Full control of private repositories)
#      - project (Full control of projects)
#   2. Add the token as a repository secret named PROJECT_TOKEN:
#      Settings > Secrets and variables > Actions > New repository secret
#   3. Create .github/project.yml with your project configuration:
#      ```yaml
#      default_project:
#        owner: "your-username-or-org"
#        number: 1  # Your project number
#      pr_status:
#        on_open: "In review"  # Status when PR is opened/reopened
#      ```
#
# For more information about erd: https://github.com/TE-ToshiakiTanaka2/tarnished
# =============================================================================

name: PR Project Status

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  call-pr-project-status:
    uses: TE-ToshiakiTanaka2/tarnished/.github/workflows/pr-project-status.yml@__ERD_REF__
    with:
      pr-number: ${{ github.event.pull_request.number }}
      config-path: ".github/project.yml"
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
