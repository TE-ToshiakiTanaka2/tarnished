# =============================================================================
# Auto Tag Workflow (Caller)
# =============================================================================
# Calls the reusable workflow from TE-ToshiakiTanaka2/tarnished to automatically
# create semantic version tags when commits are merged to develop or main.
#
# Prerequisites:
#   1. Create .github/versioning.yml with your version configuration:
#      ```yaml
#      versioning:
#        branch_prefixes:
#          major:
#            - "major/"
#          minor:
#            - "release/"
#          patch:
#            - "feature/"
#            - "fix/"
#      ```
#
# For more information about erd: https://github.com/TE-ToshiakiTanaka2/tarnished
# =============================================================================

name: Auto Tag

on:
  push:
    branches: [develop, main]

permissions:
  contents: write
  pull-requests: write

# Do not add a workflow-level concurrency block here. The reusable workflow
# already serializes tag computation per ref with the group "auto-tag-<ref>".
# Redeclaring the same group in this caller makes the caller run and the called
# workflow claim one group, and GitHub fails the run before any job starts
# (deadlock), so no tag is ever created.

jobs:
  call-auto-tag:
    uses: TE-ToshiakiTanaka2/tarnished/.github/workflows/auto-tag.yml@__ERD_REF__
    with:
      config-path: ".github/versioning.yml"
    secrets: inherit
