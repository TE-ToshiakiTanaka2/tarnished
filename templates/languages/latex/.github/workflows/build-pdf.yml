# =============================================================================
# Build LaTeX PDFs
# =============================================================================
#
# This workflow builds LaTeX projects and uploads PDFs as artifacts.
#
# Triggers:
#   - Push to main, develop, release/** branches
#   - Manual trigger (workflow_dispatch)
#
# Features:
#   - Directory-based auto-detection (scans for index.tex in paper directories)
#   - Parallel builds using matrix strategy
#   - Individual artifacts per project
#   - No Python dependency (pure shell-based detection)
#
# =============================================================================

name: Build LaTeX PDFs

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all projects regardless of changes'
        required: false
        default: false
        type: boolean
      specific_project:
        description: 'Build specific project path (e.g., arxiv/sample-en)'
        required: false
        default: ''
        type: string

# Explicit permissions for security hardening
permissions:
  contents: read
  actions: write  # Required for uploading artifacts

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job: Detect Changes
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changed Projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_projects: ${{ steps.detect.outputs.has_projects }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need at least 2 commits for diff

      - name: Detect changed projects
        id: detect
        run: |
          chmod +x .github/scripts/detect_changes.sh
          if [[ "${{ github.event.inputs.build_all }}" == "true" ]]; then
            .github/scripts/detect_changes.sh --all
          elif [[ -n "${{ github.event.inputs.specific_project }}" ]]; then
            .github/scripts/detect_changes.sh --project "${{ github.event.inputs.specific_project }}"
          else
            .github/scripts/detect_changes.sh --base HEAD~1
          fi

  # ---------------------------------------------------------------------------
  # Job: Build PDFs
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.project.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDF
        working-directory: ${{ matrix.project.path }}
        run: |
          echo "========================================"
          echo "Building: ${{ matrix.project.name }}"
          echo "Path: ${{ matrix.project.path }}"
          echo "Entry: ${{ matrix.project.entry_file }}"
          echo "========================================"

          # Run latexmk
          latexmk ${{ matrix.project.entry_file }}

          echo ""
          echo "Build completed. Output files:"
          ls -la output/

      - name: Generate artifact name
        id: artifact
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(printf '%.7s' "$GITHUB_SHA")
          ARTIFACT_NAME="${{ matrix.project.name }}-pdf-${DATE}-${SHORT_SHA}"
          echo "name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "Artifact name: ${ARTIFACT_NAME}"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ matrix.project.path }}/output/*.pdf
          retention-days: 90
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job: Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Build Summary
    needs: [detect-changes, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.detect-changes.outputs.has_projects }}" == "true" ]]; then
            echo "### Built Projects" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo '${{ needs.detect-changes.outputs.matrix }}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Build Status" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "All builds completed successfully!" >> $GITHUB_STEP_SUMMARY
            elif [[ "${{ needs.build.result }}" == "failure" ]]; then
              echo "Some builds failed. Check individual job logs for details." >> $GITHUB_STEP_SUMMARY
            else
              echo "Build status: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No projects to build (no changes detected or no matching projects)." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" >> $GITHUB_STEP_SUMMARY
