# =============================================================================
# GitHub Actions Workflow: Deno CI
# =============================================================================
#
# This workflow runs formatting, linting, type checking, and tests for Deno projects.
#
# Triggers:
#   - Push to main/develop branches
#   - Pull requests to main/develop branches
#
# Jobs:
#   - lint: Run Deno formatter check, linter, and type checker
#   - unit-test: Run unit tests
#   - integration-test: Run integration tests (only on push to main/develop)
#
# =============================================================================

name: Deno CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x

      - name: Check formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Run type check
        run: deno check **/*.ts

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x

      - name: Run unit tests
        run: deno test --allow-read --allow-write tests/unit/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x

      - name: Run integration tests
        run: deno test --allow-read --allow-write tests/integration/
