# erd - Auto-tagging configuration
# This file configures automatic version bump rules based on branch names.

[tag]
# Tag prefix (default: "v")
prefix = "v"

# Initial version when no tags exist (default: "0.1.0")
initial_version = "0.1.0"

# Version bump rules
# Patterns are matched in order - first match wins
# Supports glob-style patterns: * matches any characters, ** matches paths

[[tag.rules.patterns]]
pattern = "feat/*"
bump = "minor"

[[tag.rules.patterns]]
pattern = "feat/**"
bump = "minor"

[[tag.rules.patterns]]
pattern = "feature/*"
bump = "minor"

[[tag.rules.patterns]]
pattern = "feature/**"
bump = "minor"

[[tag.rules.patterns]]
pattern = "fix/*"
bump = "patch"

[[tag.rules.patterns]]
pattern = "fix/**"
bump = "patch"

[[tag.rules.patterns]]
pattern = "bugfix/*"
bump = "patch"

[[tag.rules.patterns]]
pattern = "bugfix/**"
bump = "patch"

[[tag.rules.patterns]]
pattern = "hotfix/*"
bump = "patch"

[[tag.rules.patterns]]
pattern = "hotfix/**"
bump = "patch"

[[tag.rules.patterns]]
pattern = "breaking/*"
bump = "major"

[[tag.rules.patterns]]
pattern = "breaking/**"
bump = "major"

[[tag.rules.patterns]]
pattern = "release/*"
bump = "release"

[[tag.rules.patterns]]
pattern = "release/**"
bump = "release"

# Default behavior when no pattern matches
# Options: major, minor, patch, rc, release
[tag.rules.default]
bump = "rc"
