services:
  {{PROJECT_NAME_LOWER}}:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: {{PROJECT_NAME_LOWER}}
    volumes:
      # Mount the project directory into the container
      - .:/workspace:cached

      # Persist bash history
      - ~/.bash_history:/home/vscode/.bash_history:cached

      # Mount host's .gitconfig.local for user name/email
      - ~/.gitconfig:/home/vscode/.gitconfig:cached
      - ~/.gitconfig.local:/home/vscode/.gitconfig.local:cached

      # Github Cli Settings
      - ~/.config/gh:/home/vscode/.config/gh:cached

    working_dir: /workspace
    # Keep the container running
    command: sleep infinity
