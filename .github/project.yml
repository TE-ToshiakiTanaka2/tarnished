# GitHub Project Integration Configuration
# For use with erd CLI: https://github.com/TE-ToshiakiTanaka2/tarnished
# Generated by setup.sh project-integration plugin

default_project:
  owner: "TE-ToshiakiTanaka2"
  number: 3

field_defaults:
  Status: "Ready"
  Size: "M"
  Priority: "P1"

# Schedule-related field defaults
schedule_defaults:
  iteration: "current"  # "current", "next", or iteration name
  start: "today"  # ISO date or relative ("today", "+7d", "+2w")
  end: "+14d"  # ISO date or relative

# PR event status configuration
pr_status:
  on_open: "In review"

# Label-based project routing (optional)
# Route issues with specific labels to additional projects.
# Each label key maps to a project with its own field_defaults.
# label_projects:
#   bugfix:
#     owner: "TE-ToshiakiTanaka2"
#     number: 2
#     field_defaults:
#       Status: "Todo"
#   incident:
#     owner: "TE-ToshiakiTanaka2"
#     number: 3
#     field_defaults:
#       Status: "Triage"
#       Priority: "P0"
