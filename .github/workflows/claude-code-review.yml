name: Claude Code Review

# First-pass automated PR review via anthropics/claude-code-action.
# This gives the lifecycle's review stage a GitHub-side representation:
# the same criteria used by the local /review skill (see
# .claude/skills/review/SKILL.md "Review Prompt Template") drive this
# CI review, so local and CI feedback stay aligned.
#
# The job is secret-guarded: when ANTHROPIC_API_KEY is not configured the
# workflow skips cleanly, so forks and downstream projects without a key
# stay green. Costs are bounded with --max-turns.

on:
  pull_request:
    branches: [develop]
    types: [opened, ready_for_review]
  workflow_call:
    inputs:
      base-branch:
        description: "Base branch the PR targets"
        required: false
        default: "develop"
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        description: "Anthropic API key; when absent the review is skipped"
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-secret:
    name: Check API Key
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not configured; skipping Claude review."
          fi

  review:
    name: First-Pass Review
    runs-on: ubuntu-latest
    needs: check-secret
    if: needs.check-secret.outputs.has_key == 'true' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            Review this pull request as a first-pass reviewer.

            If the PR body links an issue (Closes #N) and docs/design/#N/design.md
            exists, read it first and review the diff against that design.

            Review criteria (same as the repository's /review skill):
            1. Bugs & logic errors — incorrect behavior, off-by-one, null handling
            2. Security — injection, secrets exposure, missing input validation
            3. Error handling — swallowed errors, missing edge cases
            4. Design adherence — undocumented deviations from the design doc
            5. Tests — untested changed paths (name them specifically)
            6. Performance — inefficient algorithms, unnecessary allocations
            7. Type safety — unsafe casts, improper type-system use

            Report gaps and defects, not style preferences. Verify claims by
            reading the code before asserting them. Organize findings as
            Critical / Warnings / Suggestions with file:line references, omit
            empty categories, and end with a verdict: APPROVE, REQUEST_CHANGES,
            or COMMENT.
          claude_args: |
            --max-turns 25
