name: Claude Code Review

# First-pass automated PR review via anthropics/claude-code-action.
# This gives the lifecycle's review stage a GitHub-side representation:
# the same criteria used by the local /review skill (see
# .claude/skills/review/SKILL.md "Review Prompt Template") drive this
# CI review, so local and CI feedback stay aligned.
#
# The job is secret-guarded: when ANTHROPIC_API_KEY is not configured the
# workflow skips cleanly, so forks and downstream projects without a key
# stay green. Costs are bounded with --max-turns.

on:
  pull_request:
    branches: [develop]
    # opened + ready_for_review only (no synchronize) is a deliberate cost
    # bound: one first-pass review per PR, not one per push. Re-request by
    # closing/reopening the PR if a fresh pass is needed.
    types: [opened, ready_for_review]
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        description: "Anthropic API key; when absent the review is skipped"
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-secret:
    name: Check API Key
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not configured; skipping Claude review."
          fi

  review:
    name: First-Pass Review
    runs-on: ubuntu-latest
    needs: check-secret
    # The explicit `github.event.pull_request &&` guard matters: GitHub
    # expressions coerce null == false to true, so without it a caller
    # invoking this reusable workflow from a non-PR event (push, schedule)
    # would pass the draft check and fail at the action instead of skipping.
    if: needs.check-secret.outputs.has_key == 'true' && github.event.pull_request && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            Review this pull request as a first-pass reviewer.

            If the PR body links an issue (Closes #N), read BOTH ground truths
            before reviewing: docs/design/#N/design.md when it exists, and the
            issue's own Requirements section via `gh issue view N`. They are
            distinct — criterion 8 compares the diff against the design, and
            criterion 9 compares the branch against the issue. Only the second
            catches a requirement dropped before the design was written.

            Review criteria (canonical list: "Review Criteria" in
            .claude/skills/review/SKILL.md's Review Prompt Template):
            1. Bugs & Logic Errors — incorrect behavior, off-by-one, null/undefined issues
            2. Security — injection, auth issues, secrets exposure, input validation
            3. Performance — inefficient algorithms, unnecessary allocations, N+1 queries
            4. Code Quality — readability, naming, DRY violations, overly complex logic
            5. Type Safety — missing types, unsafe casts, improper use of type system
            6. Error Handling — unhandled exceptions, missing edge cases
            7. Test Coverage — are new features/changes adequately tested?
            8. Design Adherence — does the implementation match the design document?
            9. Requirement Adherence — does the branch carry every requirement in the issue?

            Report gaps and defects, not stylistic nitpicks — code-quality
            findings must materially affect maintainability or violate a
            documented project rule (.claude/rules/*). Verify claims by
            reading the code before asserting them. Organize findings as
            Critical / Major / Minor / Suggestions with file:line references,
            state explicitly when each category has no findings, and end with a verdict: APPROVE,
            REQUEST_CHANGES, or COMMENT. Critical and Major must be fixed
            before merge; Minor is fixed when cheap; Suggestions carry no
            obligation.
          claude_args: |
            --max-turns 25
