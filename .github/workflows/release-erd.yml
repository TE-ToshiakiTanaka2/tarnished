name: Release erd Binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: erd
  COVERAGE_THRESHOLD: 40

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --bins

      - name: Run integration tests
        run: cargo test --test '*'

  coverage:
    name: Check Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
            ${{ runner.os }}-cargo-

      - name: Generate coverage report
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cargo llvm-cov report --summary-only 2>/dev/null | grep "TOTAL" | awk '{print $NF}' | tr -d '%')
          echo "Current coverage: ${COVERAGE}%"
          echo "Required threshold: ${{ env.COVERAGE_THRESHOLD }}%"

          if [ -z "$COVERAGE" ]; then
            echo "::error::Failed to parse coverage value"
            exit 1
          fi

          # Compare as integers (remove decimal part)
          COVERAGE_INT=${COVERAGE%.*}
          if [ "$COVERAGE_INT" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

          echo "::notice::Coverage ${COVERAGE}% meets threshold ${{ env.COVERAGE_THRESHOLD }}%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 30

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test, coverage]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a pre-release (contains -rc)
          if echo "$VERSION" | grep -qE "\-rc\."; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp target/release/${{ env.BINARY_NAME }} release-assets/${{ env.BINARY_NAME }}-linux-x86_64
          chmod +x release-assets/${{ env.BINARY_NAME }}-linux-x86_64

          # Generate SHA256 checksum
          cd release-assets
          sha256sum ${{ env.BINARY_NAME }}-linux-x86_64 > ${{ env.BINARY_NAME }}-linux-x86_64.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/${{ env.BINARY_NAME }}-linux-x86_64
            release-assets/${{ env.BINARY_NAME }}-linux-x86_64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
