name: Auto Tag

on:
  push:
    branches: [develop, main]
  workflow_call:
    inputs:
      config-path:
        description: "Path to versioning.yml config file"
        required: false
        default: ".github/versioning.yml"
        type: string
      erd-version:
        description: "Version of erd to download (e.g., v1.0.0, latest)"
        required: false
        default: "latest"
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  ERD_REPO: TE-ToshiakiTanaka2/tarnished

jobs:
  auto-tag:
    name: Create Version Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for tags

      - name: Get branch name from PR
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $COMMIT_MSG"

          BRANCH=""

          # Method 1: Try to extract from merge commit message
          # Format: "Merge pull request #N from owner/branch-name"
          if echo "$COMMIT_MSG" | grep -q "Merge pull request"; then
            BRANCH=$(echo "$COMMIT_MSG" | sed -n 's/.*from [^/]*\/\([^ ]*\).*/\1/p')
            echo "Detected from merge commit: $BRANCH"
          fi

          # Method 2: For squash merges, extract PR number and get branch via API
          # Format: "feat: some message (#123)"
          if [ -z "$BRANCH" ]; then
            PR_NUMBER=$(echo "$COMMIT_MSG" | grep -o '(#[0-9]\+)' | head -1 | tr -d '(#)')
            if [ -n "$PR_NUMBER" ]; then
              echo "Found PR number: $PR_NUMBER"
              # Get the head branch name from PR via GitHub API
              BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
              echo "Detected from PR API: $BRANCH"
            fi
          fi

          # Method 3: Check if this is a direct push with branch-like commit message
          if [ -z "$BRANCH" ]; then
            # Try to detect branch pattern from conventional commit prefix
            # e.g., "feat:" might indicate a feature branch
            if echo "$COMMIT_MSG" | grep -qE "^(feat|feature):"; then
              echo "Conventional commit detected but no PR number found"
            fi
          fi

          echo "Final detected branch: $BRANCH"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      # === Local invocation: Build erd from source ===
      - name: Setup Rust (local)
        if: github.event_name == 'push' && steps.branch.outputs.name != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry (local)
        if: github.event_name == 'push' && steps.branch.outputs.name != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build erd (local)
        if: github.event_name == 'push' && steps.branch.outputs.name != ''
        run: cargo build --release

      # === External invocation: Download erd from Releases ===
      - name: Download erd (external)
        if: github.event_name == 'workflow_call' && steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.erd-version }}"

          if [ "$VERSION" = "latest" ]; then
            DOWNLOAD_URL="https://github.com/${{ env.ERD_REPO }}/releases/latest/download/erd-linux-x86_64"
          else
            DOWNLOAD_URL="https://github.com/${{ env.ERD_REPO }}/releases/download/${VERSION}/erd-linux-x86_64"
          fi

          echo "Downloading erd from: $DOWNLOAD_URL"
          mkdir -p target/release
          curl -fsSL -o target/release/erd "$DOWNLOAD_URL"
          chmod +x target/release/erd

          echo "erd version:"
          ./target/release/erd --version || echo "Version check failed (binary may not support --version)"

      # === Common steps ===
      - name: Configure git
        if: steps.branch.outputs.name != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.branch.outputs.name != ''
        run: |
          CONFIG_PATH="${{ inputs.config-path || '.github/versioning.yml' }}"
          ./target/release/erd tag auto --branch "${{ steps.branch.outputs.name }}" --config "$CONFIG_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip tagging (no branch detected)
        if: steps.branch.outputs.name == ''
        run: |
          echo "No branch name detected from commit message."
          echo "This might be a direct push without PR reference."
          echo "Skipping auto-tagging."
