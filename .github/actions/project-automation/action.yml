name: 'Project Automation'
description: 'Automatically add issues to GitHub Project and set initial field values'
author: 'tarnished'

inputs:
  token:
    description: 'GitHub token with project permissions (requires project scope)'
    required: true
  config-path:
    description: 'Path to configuration file'
    required: false
    default: '.github/project-automation.yml'

outputs:
  item-id:
    description: 'The project item ID (if added or already exists)'
  project-id:
    description: 'The project ID'
  already-exists:
    description: 'Whether the item already existed in the project'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'layout'
  color: 'purple'
